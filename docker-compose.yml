version: '3.8'

services:
  backend:
    build: ./backend
    container_name: transcripto-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - ASR_PROVIDER=faster_whisper
      - SUMMARY_PROVIDER=openai
    volumes:
      - ./backend/.env:/app/.env
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build: ./frontend
    container_name: transcripto-frontend
    restart: unless-stopped
    ports:
      - "5500:5500"
